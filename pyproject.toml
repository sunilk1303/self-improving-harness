[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-harness"
version = "0.0.1"
description = "E0: baseline insights harness + ground-truth-by-construction eval harness"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.40", "openai>=1.50"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
